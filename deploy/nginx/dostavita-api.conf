server {
 server_name api.dostavita.by;
 client_max_body_size 20m;
 location /.well-known/acme-challenge/ { root /var/www/html; }
 location ~ ^/(auth|rest|storage|realtime|functions)/v1(?:/|$) {
  proxy_pass http://127.0.0.1:8000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 300s;
 }
 location / { return 404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.dostavita.by/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.dostavita.by/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = api.dostavita.by) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


 listen 80;
 server_name api.dostavita.by;
    return 404; # managed by Certbot


}