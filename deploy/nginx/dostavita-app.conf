server {
 listen 80;
 server_name dostavita.by www.dostavita.by;
 location /.well-known/acme-challenge/ { root /var/www/html; }
 location / { return 308 https://www.dostavita.by$request_uri; }
}
server {
 listen 443 ssl;
 server_name dostavita.by;
 ssl_certificate /etc/letsencrypt/live/dostavita.by/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dostavita.by/privkey.pem;
 return 308 https://www.dostavita.by$request_uri;
}
server {
 listen 443 ssl;
 server_name www.dostavita.by;
 ssl_certificate /etc/letsencrypt/live/dostavita.by/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dostavita.by/privkey.pem;
 client_max_body_size 20m;
 add_header X-Content-Type-Options nosniff always;
 location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 120s;
 }
}
